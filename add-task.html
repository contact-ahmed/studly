                <li><a href="about.html">About</a></li>
            </ul>

        </nav>
    </header>


    <!-- Add Task Main Section -->
    <main class="add-task-page">

        <section class="page-heading">
            <h1>Add New Task</h1>

            <p>
                Add your assignments, projects and other
                academic activities to stay organized.
            </p>
        </section>


        <!-- Task Form -->
        <section class="task-form-container">

            <form id="task-form">

                <div class="form-group">
                    <label for="task-title">Task Title</label>

                    <input
                        type="text"
                        id="task-title"
                        placeholder="Enter task title"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="task-subject">Subject</label>

                    <input
                        type="text"
                        id="task-subject"
                        placeholder="Enter subject name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="task-date">Due Date</label>

                    <input
                        type="date"
                        id="task-date"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="task-priority">Priority</label>

                    <select id="task-priority" required>

                        <option value="">Select Priority</option>

                        <option value="low">Low</option>

                        <option value="medium">Medium</option>

                        <option value="high">High</option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="task-description">
                        Description
                    </label>

                    <textarea
                        id="task-description"
                        rows="5"
                        placeholder="Write task details..."
                    ></textarea>
                </div>


                <div class="form-buttons">

                    <button type="submit" class="btn">
                        Add Task
                    </button>

                    <a href="tasks.html" class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </main>
